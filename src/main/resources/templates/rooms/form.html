<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add room</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a></div></nav><main class="container py-4"><div class="card border-0 shadow-sm mx-auto" style="max-width:650px"><div class="card-body p-4"><h1 class="h3 mb-3">Add room</h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/rooms}" th:object="${room}" method="post"><div class="mb-3"><label class="form-label">Room number</label><input class="form-control" th:field="*{roomNumber}" required maxlength="20"><div class="text-danger small" th:errors="*{roomNumber}"></div></div><div class="mb-3"><label class="form-label">Room type</label><select class="form-select" th:field="*{roomType}" required><option value="STANDARD">Standard</option><option value="DELUXE">Deluxe</option><option value="SUITE">Suite</option></select></div><div class="mb-3"><label class="form-label">Capacity</label><input class="form-control" type="number" min="1" th:field="*{capacity}" required><div class="text-danger small" th:errors="*{capacity}"></div></div><div class="mb-3"><label class="form-label">Price per night</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{pricePerNight}" required><div class="text-danger small" th:errors="*{pricePerNight}"></div></div><button class="btn btn-primary" type="submit">Save room</button> <a class="btn btn-outline-secondary" href="/rooms">Cancel</a></form></div></div></main></body></html>
