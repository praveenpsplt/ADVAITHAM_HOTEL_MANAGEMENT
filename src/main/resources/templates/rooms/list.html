<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rooms</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a><div><a class="btn btn-sm btn-outline-light" href="/guests">Guests</a> <a class="btn btn-sm btn-outline-light" href="/bookings">Bookings</a></div></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Rooms</h1><a class="btn btn-primary" href="/rooms/new">Add room</a></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>Room</th><th>Type</th><th>Capacity</th><th>Price/night</th><th>Status</th></tr></thead><tbody><tr th:each="r : ${rooms}"><td th:text="${r.roomNumber}"></td><td th:text="${r.roomType}"></td><td th:text="${r.capacity}"></td><td th:text="${#numbers.formatDecimal(r.pricePerNight,1,2)}"></td><td><span class="badge text-bg-success" th:text="${r.status}"></span></td></tr></tbody></table></div></div></main></body></html>
