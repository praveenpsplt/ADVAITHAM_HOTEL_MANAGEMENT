<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Register guest</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a></div></nav><main class="container py-4"><div class="card border-0 shadow-sm mx-auto" style="max-width:650px"><div class="card-body p-4"><h1 class="h3 mb-3">Register guest</h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/guests}" th:object="${guest}" method="post"><div class="row"><div class="col-md-6 mb-3"><label class="form-label">First name</label><input class="form-control" th:field="*{firstName}" required><div class="text-danger small" th:errors="*{firstName}"></div></div><div class="col-md-6 mb-3"><label class="form-label">Last name</label><input class="form-control" th:field="*{lastName}" required><div class="text-danger small" th:errors="*{lastName}"></div></div></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" required><div class="text-danger small" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label">Phone</label><input class="form-control" th:field="*{phone}"></div><button class="btn btn-primary" type="submit">Save guest</button> <a class="btn btn-outline-secondary" href="/guests">Cancel</a></form></div></div></main></body></html>
