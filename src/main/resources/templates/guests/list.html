<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guests</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a><div><a class="btn btn-sm btn-outline-light" href="/rooms">Rooms</a> <a class="btn btn-sm btn-outline-light" href="/bookings">Bookings</a></div></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Guests</h1><a class="btn btn-primary" href="/guests/new">Register guest</a></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody><tr th:each="g : ${guests}"><td th:text="${g.id}"></td><td th:text="${g.fullName}"></td><td th:text="${g.email}"></td><td th:text="${g.phone}"></td></tr></tbody></table></div></div></main></body></html>
