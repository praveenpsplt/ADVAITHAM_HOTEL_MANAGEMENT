<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bookings</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a><div><a class="btn btn-sm btn-outline-light" href="/rooms">Rooms</a> <a class="btn btn-sm btn-outline-light" href="/guests">Guests</a></div></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Bookings</h1><a class="btn btn-primary" href="/bookings/new">New booking</a></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Nights</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td th:text="${b.id}"></td><td th:text="${b.guest.firstName + ' ' + b.guest.lastName}"></td><td th:text="${b.room.roomNumber}"></td><td th:text="${b.checkIn}"></td><td th:text="${b.checkOut}"></td><td th:text="${b.nights}"></td><td th:text="${#numbers.formatDecimal(b.totalPrice,1,2)}"></td><td><span class="badge" th:classappend="${b.status == 'CANCELLED'} ? ' text-bg-secondary' : ' text-bg-success'" th:text="${b.status}"></span></td><td><form th:if="${b.status == 'CONFIRMED'}" th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post" onsubmit="return confirm('Cancel this booking?')"><button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button></form></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="9" class="text-center text-secondary py-4">No bookings created yet.</td></tr></tbody></table></div></div></main></body></html>
