<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New booking</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">Hotel Management</a></div></nav><main class="container py-4"><div class="card border-0 shadow-sm mx-auto" style="max-width:700px"><div class="card-body p-4"><h1 class="h3 mb-3">Create booking</h1><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div th:if="${#lists.isEmpty(guests)}" class="alert alert-warning">Register a guest before creating a booking. <a href="/guests/new">Register guest</a></div><div th:if="${#lists.isEmpty(rooms)}" class="alert alert-warning">No available rooms are configured. <a href="/rooms/new">Add a room</a></div><form th:action="@{/bookings}" th:object="${bookingForm}" method="post"><div class="mb-3"><label class="form-label">Guest</label><select class="form-select" th:field="*{guestId}" required><option value="">Select a guest</option><option th:each="g : ${guests}" th:value="${g.id}" th:text="${g.fullName + ' — ' + g.email}"></option></select><div class="text-danger small" th:errors="*{guestId}"></div></div><div class="mb-3"><label class="form-label">Room</label><select class="form-select" th:field="*{roomId}" required><option value="">Select a room</option><option th:each="r : ${rooms}" th:value="${r.id}" th:text="${'Room ' + r.roomNumber + ' (' + r.roomType + ') — ₹' + r.pricePerNight + '/night'}"></option></select><div class="text-danger small" th:errors="*{roomId}"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Check-in</label><input class="form-control" type="date" th:field="*{checkIn}" required><div class="text-danger small" th:errors="*{checkIn}"></div></div><div class="col-md-6 mb-3"><label class="form-label">Check-out</label><input class="form-control" type="date" th:field="*{checkOut}" required><div class="text-danger small" th:errors="*{checkOut}"></div></div></div><div class="mb-3"><label class="form-label">Notes (optional)</label><textarea class="form-control" th:field="*{notes}" rows="3" maxlength="500"></textarea></div><button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(guests) or #lists.isEmpty(rooms)}">Create booking</button> <a class="btn btn-outline-secondary" href="/bookings">Cancel</a></form></div></div></main></body></html>
