<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hotel Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="/">Hotel Management</a><div class="navbar-nav"><a class="nav-link" href="/rooms">Rooms</a><a class="nav-link" href="/guests">Guests</a><a class="nav-link" href="/bookings">Bookings</a></div></div></nav>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">Dashboard</h1><p class="text-secondary mb-0">Hotel operations at a glance</p></div><a class="btn btn-primary" href="/bookings/new">+ New booking</a></div>
<div class="row g-3 mb-4"><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary">Rooms</div><div class="display-6" th:text="${roomCount}">0</div></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary">Guests</div><div class="display-6" th:text="${guestCount}">0</div></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary">All bookings</div><div class="display-6" th:text="${bookingCount}">0</div></div></div></div><div class="col-md-3"><div class="card shadow-sm border-0"><div class="card-body"><div class="text-secondary">Confirmed</div><div class="display-6" th:text="${confirmedCount}">0</div></div></div></div></div>
<div class="card shadow-sm border-0"><div class="card-header bg-white fw-semibold">Recent bookings</div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Guest</th><th>Room</th><th>Check-in</th><th>Check-out</th><th>Status</th></tr></thead><tbody><tr th:each="b : ${recentBookings}"><td th:text="${b.id}"></td><td th:text="${b.guest.firstName + ' ' + b.guest.lastName}"></td><td th:text="${b.room.roomNumber}"></td><td th:text="${b.checkIn}"></td><td th:text="${b.checkOut}"></td><td><span class="badge text-bg-success" th:text="${b.status}"></span></td></tr><tr th:if="${#lists.isEmpty(recentBookings)}"><td colspan="6" class="text-center text-secondary py-4">No bookings yet. Create your first booking.</td></tr></tbody></table></div></div>
</main></body></html>
