spring.application.name=hotel-management-system
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:hotel_management_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:hotel_app}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:change_me_app_password}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
management.endpoints.web.exposure.include=health,info
info.app.name=Hotel Management System
info.app.version=1.0.0
